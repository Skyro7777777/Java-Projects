name: macOS Runner Information

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: macos-latest

    steps:
      - name: Create diagnostic user
        shell: bash
        run: |
          if ! id -u runnerdiag >/dev/null 2>&1; then
            sudo dscl . -create /Users/runnerdiag
            sudo dscl . -create /Users/runnerdiag UserShell /bin/bash
            sudo dscl . -create /Users/runnerdiag RealName "Runner Diagnostic User"
            sudo dscl . -create /Users/runnerdiag UniqueID 510
            sudo dscl . -create /Users/runnerdiag PrimaryGroupID 20
            sudo dscl . -create /Users/runnerdiag NFSHomeDirectory /Users/runnerdiag
            sudo dscl . -passwd /Users/runnerdiag "Apple@123"
            sudo dscl . -append /Groups/admin GroupMembership runnerdiag
            sudo createhomedir -c -u runnerdiag
          fi

      - name: Collect runner information
        shell: bash
        run: |
          mkdir -p diagnostics

          OUT="diagnostics/macos-runner-info.txt"

          {
            echo "======================================"
            echo "GitHub macOS Runner Information"
            echo "======================================"
            echo

            echo "===== macOS ====="
            sw_vers
            echo
            uname -a
            echo

            echo "===== Host ====="
            hostname
            echo
            sysctl kern.hostname
            echo

            echo "===== Hardware ====="
            system_profiler SPHardwareDataType
            echo

            echo "===== Software ====="
            system_profiler SPSoftwareDataType
            echo

            echo "===== CPU ====="
            sysctl -n machdep.cpu.brand_string 2>/dev/null || true
            sysctl hw.logicalcpu
            sysctl hw.physicalcpu
            sysctl hw.memsize
            echo

            echo "===== Storage ====="
            df -h /
            echo

            echo "===== Filesystems ====="
            mount
            echo

            echo "===== Current User ====="
            whoami
            id
            pwd
            echo

            echo "===== Created User ====="
            id runnerdiag
            dscl . -read /Users/runnerdiag
            echo

            echo "===== Environment ====="
            echo "RUNNER_OS=$RUNNER_OS"
            echo "RUNNER_ARCH=$RUNNER_ARCH"
            echo "ImageOS=$ImageOS"
            echo "ImageVersion=$ImageVersion"
            echo "GITHUB_WORKFLOW=$GITHUB_WORKFLOW"
            echo "GITHUB_JOB=$GITHUB_JOB"
            echo "GITHUB_ACTIONS=$GITHUB_ACTIONS"
            echo

            echo "===== Xcode ====="
            xcodebuild -version 2>/dev/null || true
            xcode-select -p 2>/dev/null || true
            echo

            echo "===== Homebrew ====="
            brew --version
            brew config
            echo

            echo "===== Shell ====="
            echo "$SHELL"
            bash --version | head -1
            zsh --version
            echo

            echo "===== Launch Services ====="
            launchctl print system 2>/dev/null | head -200
            echo

            echo "===== Running GUI Processes ====="
            ps -axo pid,user,comm | grep -E "WindowServer|Dock|Finder|loginwindow|SystemUIServer" || true
            echo

            echo "===== Display ====="
            system_profiler SPDisplaysDataType
            echo

            echo "===== Installed Command Line Tools ====="
            pkgutil --pkgs | sort | head -200
            echo

            echo "===== Important Directories ====="
            ls -ld /
            ls -ld /Applications
            ls -ld /Users
            ls -ld /System
            echo

            echo "===== Resource Limits ====="
            ulimit -a
            echo

            echo "===== Loaded Launch Daemons (first 150) ====="
            launchctl list | head -150

          } > "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-runner-information
          path: diagnostics/macos-runner-info.txt
